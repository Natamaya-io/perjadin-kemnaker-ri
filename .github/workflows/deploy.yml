name: CI/CD Multi-Environment (Staging & Production)

on:
  push:
    branches: [ "staging", "main" ]

env:
  REGISTRY: ghcr.io
  REPO_NAME: myceldev-com/perjadin-kemnaker-ri

jobs:
  build-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_USE_REAL_API=true
            VITE_SHOW_DEMO_BANNER=${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Webhook)
    needs: [build-push-backend, build-push-frontend]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Execute Webhook via Cloudflare Access
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}" \
          -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
          -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

  deploy-production:
    name: Deploy to Production
    needs: [build-push-backend, build-push-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy Quadlets to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "deploy/quadlets/*"
          target: "perjadin-app/deploy/quadlets"
          strip_components: 2

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GH_TOKEN,REGISTRY
          script: |
            # Login to GHCR to allow podman auto-update to pull private images
            echo "$GH_TOKEN" | podman login "$REGISTRY" -u ${{ github.actor }} --password-stdin
            
            # Ensure target directories exist
            mkdir -p ~/.config/containers/systemd/
            mkdir -p ~/.config/systemd/user/
            
            # Copy quadlets to systemd directory
            cp -r ~/perjadin-app/deploy/quadlets/* ~/.config/containers/systemd/ || true
            cp ~/perjadin-app/deploy/quadlets/perjadin-secrets.service ~/.config/systemd/user/ || true
            
            # Reload systemd and restart services
            systemctl --user daemon-reload
            systemctl --user restart perjadin-backend.service perjadin-frontend.service
            
            # Trigger auto-update
            podman auto-update

