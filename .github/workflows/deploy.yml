name: CD (Enterprise Build, Push & Deploy)

on:
  push:
    branches: [ "staging" ]

env:
  REGISTRY: ghcr.io
  REPO_NAME: xm4yestiK/perjadin-kemnaker-ri

jobs:
  build-push-backend:
    name: Build & Push Backend (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:staging
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend (SvelteKit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend (With Vite Build-Args)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_USE_REAL_API=true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:staging
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-webhook:
    name: Trigger aaPanel Deployment
    needs: [build-push-backend, build-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Execute Webhook via Cloudflare Access
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}" \
          -H "CF-Access-Client-Id: ${{ secrets.CF_CLIENT_ID }}" \
          -H "CF-Access-Client-Secret: ${{ secrets.CF_CLIENT_SECRET }}")
          
          echo "Webhook HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to trigger aaPanel webhook!"
            exit 1
          fi
