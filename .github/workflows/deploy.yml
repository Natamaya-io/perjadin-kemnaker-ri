name: CI/CD Multi-Environment (Staging & Production)

on:
  push:
    branches: [ "staging", "main" ]

env:
  REGISTRY: ghcr.io
  REPO_NAME: raxbyte-org/perjadin-kemnaker-ri

jobs:
  build-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_USE_REAL_API=true
            VITE_SHOW_DEMO_BANNER=${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Webhook)
    needs: [build-push-backend, build-push-frontend]
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Execute Webhook via Cloudflare Access
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.AAPANEL_WEBHOOK_URL }}" \
          -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
          -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

  deploy-production:
    name: Deploy to Production (Direct SSH)
    needs: [build-push-backend, build-push-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            cd /home/gatsu51/perjadin-app
            
            # Sync docker-compose.yml dan config terbaru dari GitHub
            git pull https://xm4yestiK:${{ secrets.GITHUB_TOKEN }}@github.com/raxbyte-org/perjadin-kemnaker-ri.git main
            
            export DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_PROD }}
            
            # Tambahkan path umum agar podman ditemukan
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Gunakan 'podman compose' (standar baru) yang lebih robust
            doppler run -- podman compose pull
            doppler run -- podman compose up -d --build
            
            podman image prune -f
            podman compose ps
