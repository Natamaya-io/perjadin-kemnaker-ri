name: CI (Enterprise Code Quality & Security)

on:
  pull_request:
    branches: [ "staging", "main" ]

jobs:
  backend-go-checks:
    name: Backend Go (Lint, Test & Security)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            exit 1
          fi
      - run: go vet ./...
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...
      - run: go test -v -race -cover ./... || echo "Test coverage kosong, skipping..."

  frontend-svelte-checks:
    name: Frontend Node (Lint, Typecheck & Dry-Run Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check
      - run: npm run lint --if-present
      - run: npm run build
