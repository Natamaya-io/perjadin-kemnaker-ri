name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]

jobs:
  backend-build-test:
    name: Backend Go (Build & Vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.0'
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: go mod download

    - name: Run Go Vet (Static Analysis)
      run: go vet ./...

    - name: Build Backend Binary
      run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o main ./cmd/api/main.go

    - name: Run Tests (if available)
      run: |
        if [ -d "tests" ] || [ $(find . -name "*_test.go" | wc -l) -gt 0 ]; then
          go test -v ./...
        else
          echo "No tests found. Skipping test phase."
        fi

  frontend-build-check:
    name: Frontend SvelteKit (Check & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Svelte Check (TypeScript & Linting)
      run: npm run check

    - name: Build Frontend Application
      run: npm run build

  docker-compose-test:
    name: Docker Environment Integrity
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-check]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Verify Docker Compose Config
      run: docker compose config -q

    - name: Build All Docker Containers
      run: docker compose build

    - name: Test Container Startup (Dry Run)
      run: |
        docker compose up -d
        sleep 10
        docker compose ps
        docker compose logs
        docker compose down
