name: CI/CD Pipeline (Single Container)

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  build-push-app:
    name: Build & Push Single App Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        run: echo "REPO_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_URL=/api/v1
            VITE_USE_REAL_API=true
            VITE_SHOW_DEMO_BANNER=${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME_LC }}-app:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME_LC }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: [build-push-app]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.VNET_TAILSCALE_AUTHKEY }}
          version: latest

      - name: Copy Quadlets to Server via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }} "mkdir -p ~/perjadin-app/deploy/quadlets-stg"
          scp -o StrictHostKeyChecking=no -r deploy/quadlets-stg/* ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }}:~/perjadin-app/deploy/quadlets-stg/

      - name: Execute Deployment via Tailscale SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }} << EOF
            echo "DOPPLER_TOKEN=$DOPPLER_TOKEN" > ~/.doppler_stg_token
            chmod 600 ~/.doppler_stg_token
            echo "$GH_TOKEN" | podman login "$REGISTRY" -u ${{ github.actor }} --password-stdin
            
            mkdir -p ~/.config/containers/systemd/
            mkdir -p ~/.config/systemd/user/
            
            # Clean old quadlets
            rm -f ~/.config/containers/systemd/perjadin-stg-frontend.container
            rm -f ~/.config/containers/systemd/perjadin-stg-backend.container
            systemctl --user stop perjadin-stg-frontend.service perjadin-stg-backend.service || true
            systemctl --user disable perjadin-stg-frontend.service perjadin-stg-backend.service || true

            cp -r ~/perjadin-app/deploy/quadlets-stg/* ~/.config/containers/systemd/ || true
            cp ~/perjadin-app/deploy/quadlets-stg/perjadin-stg-secrets.service ~/.config/systemd/user/ || true
            systemctl --user daemon-reload
            
            podman auto-update || true
            systemctl --user start perjadin-stg-app.service
          EOF

  deploy-production:
    name: Deploy to Production
    needs: [build-push-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.VNET_TAILSCALE_AUTHKEY }}
          version: latest

      - name: Copy Quadlets to Server via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }} "mkdir -p ~/perjadin-app/deploy/quadlets"
          scp -o StrictHostKeyChecking=no -r deploy/quadlets/* ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }}:~/perjadin-app/deploy/quadlets/

      - name: Execute Deployment via Tailscale SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GATSU51_SERVER_USERNAME }}@${{ secrets.GATSU51_TAILSCALE_IP }} << EOF
            echo "$GH_TOKEN" | podman login "$REGISTRY" -u ${{ github.actor }} --password-stdin
            
            mkdir -p ~/.config/containers/systemd/
            mkdir -p ~/.config/systemd/user/
            
            # Clean old quadlets
            rm -f ~/.config/containers/systemd/perjadin-frontend.container
            rm -f ~/.config/containers/systemd/perjadin-backend.container
            systemctl --user stop perjadin-frontend.service perjadin-backend.service || true
            systemctl --user disable perjadin-frontend.service perjadin-backend.service || true

            cp -r ~/perjadin-app/deploy/quadlets/* ~/.config/containers/systemd/ || true
            cp ~/perjadin-app/deploy/quadlets/perjadin-secrets.service ~/.config/systemd/user/ || true
            
            systemctl --user daemon-reload
            podman auto-update
            systemctl --user start perjadin-app.service
            
            sleep 10
            echo "=== APP LOGS ==="
            journalctl --user -u perjadin-app.service --no-pager -n 150
          EOF
