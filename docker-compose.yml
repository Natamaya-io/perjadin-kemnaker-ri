version: '3.8'

services:
  # ==============================================
  # Redis Service (Caching & Session Store)
  # ==============================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"

  # ==============================================
  # Backend Service (Go API)
  # ==============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - APP_PORT=${APP_PORT}
      - SEED_DB=${SEED_DB}
      - GIN_MODE=${GIN_MODE}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - redis
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    # Using 'host.docker.internal' requires extra_hosts on Linux, usually automatic on Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==============================================
  # Gotenberg Service (PDF Generation)
  # ==============================================
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ${COMPOSE_PROJECT_NAME}_gotenberg
    shm_size: "2g"
    ports:
      - "3000" # Internal port mapping, accessible by frontend/backend. Host port not strictly needed unless debugging.
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--api-timeout=300s"
      - "--chromium-disable-routes=false"
      - "--chromium-disable-web-security"
      - "--chromium-ignore-certificate-errors"
      - "--chromium-allow-insecure-localhost"

  # ==============================================
  # Frontend Service (SvelteKit)
  # ==============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_frontend
    environment:
      # Public URL for client-side fetches (browser -> nginx/backend)
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      # Internal URL for server-side fetches (ssr -> backend container)
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      # Vite specific env vars if needed
      - VITE_API_URL=${PUBLIC_API_URL}
      # Allow large payload uploads (50MB)
      - BODY_SIZE_LIMIT=52428800
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  backend_uploads:
    driver: local
